# inherites from base_experiment.yaml
# most of the options have docs at https://lightning.ai/docs/pytorch/stable/common/trainer.html

tasks: [training] # tasks to run sequantially, change when your project has multiple stages and you want to run only a subset of them.
num_nodes: 1 # number of gpu servers used in large scale distributed training

resume: null

optimizer:
  lr: 1e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  fused: true

lr_scheduler:
  name: constant_with_warmup
  num_warmup_steps: 4000
  num_training_steps: 250000

data:
  batch_size: 8
  num_workers: 16
  shuffle: true
  pin_mem: true
  prefetch_factor: 2

precision: 16-mixed
max_epoches: 22
max_steps: -1
max_run_seconds: 0  # 0 disables the clean wall-time stop
save_freq: 2
save_last_freq: 1

ema:
  enable: true
  decay: 0.9999
  every_n_steps: 1

find_unused_parameters: false
static_graph: true
gradient_as_bucket_view: true
bucket_cap_mb: null
grad_norm_freq: 5000
gradient_clip_val: 0.0
